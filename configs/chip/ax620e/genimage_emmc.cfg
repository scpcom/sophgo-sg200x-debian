image sdcard.img {
    hdimage {
        partition-table-type="none"
    }
    partition load {
	image = "emmc.img"
	size = 153344K
    }
    partition boot {
        image = "boot.vfat"
        size = 128M
    }
    partition root {
        image = "root.ext4"
    }
}
image boot.vfat {
    vfat {
        label="boot"
    }
    mountpoint = "/boot"
    size = 128M
}
image root.ext4 {
    ext4 {
        label="root"
        use-mke2fs=true
    }
    mountpoint = "/"
    size = 150%
}

